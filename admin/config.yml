backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "blog"
    label: "Tin tức"
    folder: "blog"
    create: true
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - { label: "Ngày đăng", name: "date", widget: "datetime" }
      - { label: "Ảnh bìa", name: "image", widget: "image" }
      - { label: "Nội dung", name: "body", widget: "markdown" }

  - name: "products"
    label: "Sản phẩm"
    folder: "products"
    create: true
    fields:
      - { label: "Tên sản phẩm", name: "title", widget: "string" }
      - { label: "Hình ảnh", name: "image", widget: "image" }
      - { label: "Giá", name: "price", widget: "number" }
      - { label: "Mô tả", name: "description", widget: "text" }

  - name: "brands"
    label: "Thương hiệu"
    folder: "brands"
    create: true
    fields:
      - { label: "Tên thương hiệu", name: "title", widget: "string" }
      - { label: "Logo", name: "image", widget: "image" }

  - name: "pages"
    label: "Trang nội dung"
    files:
      - file: "about.json"
        name: "about"
        label: "Giới thiệu"
        fields:
          - { label: "Tiêu đề", name: "title", widget: "string" }
          - { label: "Nội dung", name: "body", widget: "markdown" }
      - file: "contact.json"
        name: "contact"
        label: "Liên hệ"
        fields:
          - { label: "Địa chỉ", name: "address", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Hotline", name: "phone", widget: "string" }

  - name: "settings"
    label: "Cấu hình chung"
    files:
      - file: "config.json"
        name: "settings"
        label: "Cài đặt"
        fields:
          - { label: "Tên Website", name: "site_name", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image" }
