collections:
  # 1. Các phần có nhiều mục (như danh sách)
  - name: "blog"
    label: "Tin tức"
    folder: "blog"
    create: true
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - { label: "Ảnh bìa", name: "image", widget: "image" }
      - { label: "Nội dung", name: "body", widget: "markdown" }

  - name: "products"
    label: "Sản phẩm"
    folder: "products"
    create: true
    fields:
      - { label: "Tên sản phẩm", name: "title", widget: "string" }
      - { label: "Hình ảnh", name: "image", widget: "image" }
      - { label: "Giá", name: "price", widget: "number" }

  - name: "brands"
    label: "Thương hiệu"
    folder: "brands"
    create: true
    fields:
      - { label: "Tên", name: "title", widget: "string" }
      - { label: "Logo", name: "image", widget: "image" }

  # 2. Các phần nội dung cố định (Trang chủ, Giới thiệu, Liên hệ)
  - name: "settings"
    label: "Cấu hình Website"
    files:
      - file: "home.json"
        name: "home"
        label: "Trang chủ"
        fields:
          - { label: "Tiêu đề chính", name: "hero_title", widget: "string" }
          - { label: "Ảnh Banner", name: "hero_image", widget: "image" }
          - { label: "Giới thiệu ngắn", name: "hero_desc", widget: "text" }

      - file: "contact.json"
        name: "contact"
        label: "Liên hệ"
        fields:
          - { label: "Địa chỉ", name: "address", widget: "string" }
          - { label: "Hotline", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
